<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5597">
  <title>報修登記</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">示範系統：請只填寫虛構的姓名與地點。</p>
    <button type="button" id="install-btn" class="install-btn" hidden>安裝到主畫面</button>
  </header>
  <div id="offline-banner" class="offline-banner" role="status" hidden>目前離線：可以查看畫面，但無法送出或更新清單。</div>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text"
                 maxlength="50" autocomplete="off" required
                 placeholder="例如：陳示範">
          <p class="field-error" id="reporter_name-error"></p>
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req">*</span></label>
          <input id="location" name="location" type="text"
                 maxlength="100" autocomplete="off" required
                 placeholder="例如：示範大樓 3F 會議室A">
          <p class="field-error" id="location-error"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">類別 <span class="req">*</span></label>
            <select id="category" name="category" required>
              <option value="">請選擇</option>
              <option value="設備">設備</option>
              <option value="網路">網路</option>
              <option value="環境">環境</option>
              <option value="其他">其他</option>
            </select>
            <p class="field-error" id="category-error"></p>
          </div>

          <div class="field">
            <label for="urgency">緊急程度 <span class="req">*</span></label>
            <select id="urgency" name="urgency" required>
              <option value="低">低</option>
              <option value="中" selected>中</option>
              <option value="高">高</option>
            </select>
            <p class="field-error" id="urgency-error"></p>
          </div>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req">*</span></label>
          <textarea id="description" name="description" rows="4"
                    maxlength="1000" required
                    placeholder="請描述發生的問題"></textarea>
          <p class="hint"><span id="description-count">0</span> / 1000 字</p>
          <p class="field-error" id="description-error"></p>
        </div>

        <button type="submit" id="submit-btn">送出報修</button>
        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button type="button" id="refresh-btn" class="secondary">重新整理</button>
      </div>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <footer class="site-footer">報修登記系統（示範）</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
